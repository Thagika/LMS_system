services:
  backend:
    image: lms-backend:latest
    build: .
    env_file: .env
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
    volumes:
       - ./target:/app/target
    ports:
      - "8080:8080"

  localstack:          #  added for local development to see if AWS functionality works
    image: localstack/localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    volumes:
      - "./localstack:/var/lib/localstack"

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
